<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - HardwareNexus</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../static/css/auth.css" th:href="@{/css/auth.css}">
</head>

<body class="bg-overlay d-flex align-items-center justify-content-center p-3">

<div class="auth-container position-relative overflow-hidden">

    <!-- Background -->
    <img
        src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=2070"
        class="auth-bg-image"
        alt="Workspace">

    <div class="auth-overlay"></div>

    <div class="row g-0 h-100 position-relative z-2">

        <!-- LEFT SIDE -->
        <div class="col-lg-6 d-none d-lg-flex flex-column justify-content-end p-5 text-white">

            <div>
                <i class="bi bi-person-plus display-4 mb-3"></i>

                <h1 class="fw-bold display-5 mb-3">
                    HardwareNexus
                </h1>

                <p class="text-white-50 fs-6 lh-lg mb-0">
                    Create your account to start managing IT assets in one place.
                </p>
            </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="col-lg-6 d-flex align-items-center">

            <div class="login-panel w-100 p-4 p-lg-5">

                <!-- HEADER -->
                <h2 class="fw-bold text-white mb-2">Create account</h2>

                <p class="text-light mb-3">
                    Quickly set up secure access to the HardwareNexus inventory portal.
                </p>

                <!-- ERROR MESSAGE -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <!-- JS ERROR BOX -->
                <div id="errorBox" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    <span id="errorMessage"></span>
                    <button type="button" class="btn-close" onclick="document.getElementById('errorBox').classList.add('d-none')"></button>
                </div>

                <form id="registerForm"
                      th:action="@{/register-user}"
                      th:method="post"
                      method="post"
                      action="/register-user">

                    <!-- HIDDEN ROLE (always Inventory Manager) -->
                    <input type="hidden" name="role" value="staff">

                    <!-- NAME -->
                    <div class="mb-3">
                        <input type="text"
                               class="form-control auth-input"
                               name="firstName"
                               placeholder="First name"
                               required>
                    </div>

                    <div class="mb-3">
                        <input type="text"
                               class="form-control auth-input"
                               name="lastName"
                               placeholder="Last name"
                               required>
                    </div>

                    <!-- EMAIL -->
                    <div class="mb-3">
                        <input type="email"
                               class="form-control auth-input"
                               name="email"
                               placeholder="Email address"
                               required>
                    </div>

                    <!-- PASSWORD -->
                    <div class="mb-3 position-relative">
                        <input type="password"
                               id="regPassword"
                               name="password"
                               class="form-control auth-input"
                               placeholder="Create password"
                               required>

                        <button type="button"
                                class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-2 password-toggle"
                                onclick="togglePassword('regPassword')">
                            <i class="bi bi-eye" id="regPassword-icon"></i>
                        </button>
                    </div>

                    <div class="mb-4 position-relative">
                        <input type="password"
                               id="confirmPassword"
                               name="confirmPassword"
                               class="form-control auth-input"
                               placeholder="Confirm password"
                               required>
                    </div>

                    <!-- BUTTON -->
                    <button type="submit" class="btn btn-system-primary w-100 fw-bold py-2">
                        Create account
                    </button>

                    <!-- LOGIN LINK -->
                    <div class="text-center mt-3">
                        <small class="text-light">
                            Already have an account?
                            <a th:href="@{/login}" href="/login"
                               class="text-white fw-semibold text-decoration-underline">
                                Sign in
                            </a>
                        </small>
                    </div>

                </form>

            </div>

        </div>

    </div>
</div>

<script>
function togglePassword(id) {
    const input = document.getElementById(id);
    const icon = document.getElementById(id + "-icon");

    if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("bi-eye", "bi-eye-slash");
    } else {
        input.type = "password";
        icon.classList.replace("bi-eye-slash", "bi-eye");
    }
}
</script>

<script src="../static/js/auth.js" th:src="@{/js/auth.js}"></script>

</body>
</html>
