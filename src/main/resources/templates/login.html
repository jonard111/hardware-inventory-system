<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - HardwareNexus</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body data-theme="dark" class="bg-overlay d-flex align-items-center justify-content-center p-3">

<div class="auth-container position-relative overflow-hidden">

    <!-- Background Image -->
    <img
        src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=2070"
        class="auth-bg-image"
        alt="Workspace">

    <div class="auth-overlay"></div>

    <div class="row g-0 position-relative z-2 h-100">

        <!-- LEFT SIDE -->
        <div class="col-lg-6 d-none d-lg-flex flex-column justify-content-end p-5 text-white">
            <div>
                <i class="bi bi-diagram-3 display-4 mb-3"></i>

                <h1 class="fw-bold display-5">HardwareNexus</h1>

                <p class="text-white-50">
                    Next-generation IT asset management system.
                </p>
            </div>
        </div>

        <!-- RIGHT SIDE -->
                
        <div class="col-lg-6 d-flex align-items-center login-panel ">

            <div class=" w-100 p-4 p-lg-5">

                <h2 class="fw-bold mb-1">Welcome Back</h2>
                <p class="text-light mb-3">
                    Secure login to access inventory system.
                </p>

                <!-- ERROR MESSAGE -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    <span th:text="${error}"></span>

                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- LOGIN FORM -->
                <form id="loginForm" th:action="@{/login-user}" method="post">

                    <!-- EMAIL -->
                    <div class="mb-3">
                        <label class="form-label text-light small">Email</label>
                        <input type="email" id="loginEmail" name="email"
                               class="form-control auth-input"
                               placeholder="Enter your email"
                               required>
                    </div>

                    <!-- PASSWORD -->
                    <div class="mb-3">
                        <label class="form-label text-light small">Password</label>

                        <div class="position-relative">
                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control auth-input"
                                   placeholder="Enter your password"
                                   required>

                            <button type="button"
                                    class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-2 password-toggle"
                                    onclick="togglePassword('password')">
                                <i class="bi bi-eye" id="password-icon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- LOGIN BUTTON -->
                    <button type="submit" class="btn btn-system-primary w-100 py-2 fw-bold">
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        Sign In
                    </button>

                </form>

                <!-- REGISTER LINK -->
                <div class="text-center mt-4">
                    <small class="text-light">
                        Don’t have an account?
                        <a th:href="@{/register}"
                           class="text-white fw-bold text-decoration-underline">
                            Sign Up
                        </a>
                    </small>
                </div>

            </div>

        </div>

    </div>
</div>

<!-- PASSWORD TOGGLE SCRIPT -->
<script>
function togglePassword(id) {
    const input = document.getElementById(id);
    const icon = document.getElementById(id + "-icon");

    if (!input || !icon) return;

    const isPassword = input.type === "password";

    input.type = isPassword ? "text" : "password";

    icon.classList.toggle("bi-eye", !isPassword);
    icon.classList.toggle("bi-eye-slash", isPassword);
}
</script>

</body>
</html>
