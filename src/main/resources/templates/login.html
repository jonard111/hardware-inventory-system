<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - HardwareNexus</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../static/css/auth.css" th:href="@{/css/auth.css}">
</head>

<body data-theme="dark" class="bg-overlay d-flex align-items-center justify-content-center p-3">

<div class="auth-container position-relative overflow-hidden">

    <!-- Background -->
    <img
        src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=2070"
        class="auth-bg-image"
        alt="Workspace">

    <div class="auth-overlay"></div>

    <div class="row g-0 position-relative z-2 h-100">

        <!-- LEFT SIDE -->
        <div class="col-lg-6 d-none d-lg-flex flex-column justify-content-end p-5 text-white">
            <div>
                <i class="bi bi-diagram-3 display-4 mb-3"></i>

                <h1 class="fw-bold display-5">HardwareNexus</h1>

                <p class="text-white-50">
                    Next-generation IT asset management terminal.
                </p>
            </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="col-lg-6 d-flex align-items-center">

            <div class="login-panel w-100 p-4 p-lg-5 text-white">

                <h2 class="fw-bold mb-1">Welcome Back</h2>
                <p class="text-light mb-3">Securely sign in to access hardware inventory and request management.</p>

                <form id="loginForm" th:action="@{/login-user}" th:method="post" method="post" action="/login-user">

                    <!-- ACCOUNT TYPE -->
                    <div class="mb-3">
                        <label for="loginRole" class="form-label text-light small">Account type</label>
                        <select id="loginRole" name="role" class="form-select auth-input" aria-required="true" required>
                            <option value="" selected disabled>Select account type</option>
                            <option value="manager">Inventory Manager</option>
                            <option value="staff">Staff Member</option>
                        </select>
                    </div>

                    <!-- EMAIL -->
                    <div class="mb-3">
                        <label class="form-label text-light small">Email</label>
                        <input type="email" id="loginEmail" name="email" class="form-control auth-input" required>
                    </div>

                    <!-- PASSWORD -->
                    <div class="mb-3">
                        <label class="form-label text-light small">Password</label>

                        <div class="position-relative">
                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control auth-input"
                                   required>

                            <button type="button"
                                    class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-2 password-toggle"
                                    onclick="togglePassword('password')">
                                <i class="bi bi-eye" id="password-icon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-light small" for="rememberMe">
                                Remember me
                            </label>
                        </div>
                       
                    </div>

                    <!-- SIGN IN BUTTON -->
                    <button type="submit" class="btn btn-system-primary  w-100 py-2 fw-bold">
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        Sign In
                    </button>

                </form>
                    <!-- REGISTER SECTION (RESTORED) -->
                    <div class="text-center mt-4">
                        <small class="text-light">
                            Don’t have an account?
                            <a th:href="@{/register}" href="/register" class="text-white fw-bold text-decoration-underline ">
                                Sign Up
                            </a>
                        </small>
                    </div>

        

            </div>

        </div>

    </div>
</div>

<!-- SCRIPT -->
<script>
function togglePassword(id) {
    const input = document.getElementById(id);
    const icon = document.getElementById(id + "-icon");

    if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("bi-eye", "bi-eye-slash");
    } else {
        input.type = "password";
        icon.classList.replace("bi-eye-slash", "bi-eye");
    }
}
</script>
<script src="../static/js/auth.js" th:src="@{/js/auth.js}"></script>
</body>
</html>
